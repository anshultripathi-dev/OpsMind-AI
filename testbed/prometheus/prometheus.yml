global:
  scrape_interval: 5s       # = SAMPLE_SEC in opsmind/config.py
  evaluation_interval: 5s
scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8000"], labels: { service: gateway } }]
  - job_name: auth
    static_configs: [{ targets: ["auth:8000"], labels: { service: auth } }]
  - job_name: order
    static_configs: [{ targets: ["order:8000"], labels: { service: order } }]
  - job_name: payment
    static_configs: [{ targets: ["payment:8000"], labels: { service: payment } }]
  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]
  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]
  - job_name: stats
    static_configs: [{ targets: ["stats-exporter:9200"] }]

# The static-threshold baseline of the proposal, expressed as the Prometheus alert rules it stands for
rule_files: []
